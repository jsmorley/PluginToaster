[Rainmeter]
Update=1000
AccurateText=1
OnRefreshAction=[!SnapEdges "0"][!CommandMeasure MeasureScript "CheckMail()"]
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=Check for mail
ContextAction=[!CommandMeasure MeasureScript "CheckMail()"]
ContextTitle2=Switch to #GMailLabel1#
ContextAction2=[!CommandMeasure MeasureScript "SelectAccount(1)"]
ContextTitle3=Switch to #GMailLabel2#
ContextAction3=[!CommandMeasure MeasureScript "SelectAccount(2)"]
ContextTitle4=Send test notification
ContextAction4=[!CommandMeasure MeasureTestToast "Show"]
ContextTitle5=Open @Resources folder
ContextAction5=["#@#"]
ContextTitle6=More actions ...
ContextAction6=[!SkinMenu]

[Metadata]
Name=GMailNotify
Author=JSMorley
Version=1.1
License=Creative Commons Attribution-Non-Commercial-Share Alike 3.0
Information=Checks the Gmail Atom feed for unread messages and sends native Windows notifications.

[Variables]
GMailIcon=GMailModern
@Include1=#@#GeneralVariables.inc
@Include2=#@#GMailNotify.inc
InboxURL1=https://mail.google.com/mail/u/0/#inbox
InboxURL2=https://mail.google.com/mail/u/1/#inbox
ShowMessageDetails=1
ActiveLabel=#GMailLabel1#
ActiveInboxURL=#InboxURL1#

[MeasureMail1]
Measure=WebParser
Flags=Resync | NoCookies
URL=https://#GMailID1#:#GMailPassword1#@mail.google.com/gmail/feed/atom/
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=60
Disabled=1
FinishAction=[!CommandMeasure MeasureScript "ProcessMail(1)"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "FeedError(1)"]
OnRegExpErrorAction=[!CommandMeasure MeasureScript "FeedError(1)"]

[MeasureMail2]
Measure=WebParser
Flags=Resync | NoCookies
URL=https://#GMailID2#:#GMailPassword2#@mail.google.com/gmail/feed/atom/
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=60
Disabled=1
FinishAction=[!CommandMeasure MeasureScript "ProcessMail(2)"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "FeedError(2)"]
OnRegExpErrorAction=[!CommandMeasure MeasureScript "FeedError(2)"]

[MeasureScript]
Measure=Script
ScriptFile=#@#GMailNotify.lua
UpdateDivider=-1

[MeasureToast]
Measure=Plugin
Plugin=Toaster
Title=New Gmail for #ActiveLabel#
Text=[&MeasureScript:GetAuthor()]
Text2=[&MeasureScript:GetSubject()]
Icon=#@#Images\#GMailIcon#.png
LaunchURI=#ActiveInboxURL#
Button1=Open inbox
Button1URI=#ActiveInboxURL#
SoundFile=#@#Sounds\WindowsNotifyEmail.wav
Cooldown=5
DynamicVariables=1

[MeasureTestToast]
Measure=Plugin
Plugin=Toaster
Title=GMailToaster
Text=Windows notifications are ready.
Icon=#@#Images\#GMailIcon#.png
LaunchURI=#ActiveInboxURL#
Button1=Open inbox
Button1URI=#ActiveInboxURL#
SoundFile=#@#Sounds\WindowsNotifyEmail.wav
DynamicVariables=1

[MeterAllBackground]
Meter=Shape
Shape=Rectangle 0.5,0.5,169,59,12 | Fill Color #BackgroundColor# | StrokeWidth 1.5 | Stroke Color #FrameColor#
W=170
H=60
MouseActionCursor=0
MouseScrollDownAction=[!CommandMeasure MeasureScript "CheckMail()"]

[MeterImage]
Meter=Image
ImageName=#@#Images\#GMailIcon#.png
X=15
Y=9
W=42
PreserveAspectRatio=1
GreyScale=1
AntiAlias=1
LeftMouseUpAction=["#ActiveInboxURL#"]
ToolTipTitle=Gmail for #ActiveLabel#
ToolTipText=[&MeasureScript:GetTooltip()]
ToolTipIcon=#@#Images\#GMailIcon#.ico
ToolTipType=1
ToolTipWidth=250
DynamicVariables=1

[MeterCount]
Meter=String
X=154
Y=22
StringAlign=Right
FontFace=#TextFont#
FontSize=11
FontColor=#ValueColor#
AntiAlias=1
Text=Checking
