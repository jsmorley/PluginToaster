[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=ToasterTest
Author=Jeffrey Morley
Version=1.0.0
Information=Enter a message to test native Windows notifications and sound.

[Variables]
ToasterTestSubmitted=
EditMessage=[!CommandMeasure MeasureInput "ExecuteBatch 1-2"]

[MeasureInput]
Measure=Plugin
Plugin=InputText
X=16
Y=62
W=326
H=23
FontFace=Segoe UI
FontSize=12
StringAlign=Center
SolidColor=255,248,238,255
FocusDismiss=1
InputLimit=160
DefaultValue=#ToasterTestSubmitted#
DynamicVariables=1
Command1=!SetVariable ToasterTestSubmitted """$UserInput$"""
Command2=[!CommandMeasure MeasureForm "Send()"]

[MeasureForm]
Measure=Script
ScriptFile=#@#ToasterTest.lua
UpdateDivider=-1

[MeasureToast]
Measure=Plugin
Plugin=Toaster
Title=Toaster Test
Text=[&MeasureForm:GetMessage()]
Icon=#@#Images\Toast.png
SoundFile=#@#Sounds\WindowsNotifyEmail.wav
Cooldown=5
DynamicVariables=1

[MeterPanel]
Meter=Shape
Shape=Rectangle 0.5,0.5,357,123,12 | Fill Color 35,30,27,255 | Stroke Color 100,77,63,255 | StrokeWidth 1

[MeterIcon]
Meter=Image
ImageName=#@#Images\Toast.png
X=13
Y=8
W=38
H=38
PreserveAspectRatio=1

[MeterTitle]
Meter=String
X=57
Y=15
FontFace=Segoe UI
FontSize=15
StringStyle=Bold
FontColor=255,249,241,255
AntiAlias=1
Text=Toaster Test

[MeterField]
Meter=Shape
Shape=Rectangle 14.5,54.5,329,36,5 | Fill Color 53,44,38,255 | Stroke Color 134,106,87,255 | StrokeWidth 1
LeftMouseUpAction=#EditMessage#

[MeterPrompt]
Meter=String
X=179
Y=73
FontFace=Segoe UI
FontSize=11
StringAlign=CenterCenter
FontColor=255,243,225,255
AntiAlias=1
Text=Click to type a message
LeftMouseUpAction=#EditMessage#

[MeterStatus]
Meter=String
X=15
Y=99
FontFace=Segoe UI
FontSize=9
FontColor=220,201,182,255
AntiAlias=1
Text=Press Enter to send.
